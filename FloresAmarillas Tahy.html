<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        #welcomeScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #welcomeScreen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .welcome-sunflower-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .welcome-sunflower {
            width: 190px;
            height: 190px;
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
            z-index: 2;
        }

        .welcome-particle {
            position: absolute;
            background: #ffea00;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px #ffcc00;
            opacity: 0.8;
            animation: floatParticle 3s ease-in-out infinite alternate;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0px) scale(0.8); opacity: 0.4; }
            100% { transform: translateY(-25px) scale(1.2); opacity: 1; }
        }

        .welcome-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem;
            color: #ffea00;
            text-shadow: 0 0 12px rgba(255, 234, 0, 0.8), 0 0 25px rgba(255, 200, 0, 0.5);
            animation: textGlow 2s ease-in-out infinite alternate;
            letter-spacing: 1px;
            text-align: center;
            z-index: 2;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.97); filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.5)); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 40px rgba(255, 234, 0, 0.85)); }
        }

        @keyframes textGlow {
            0% { opacity: 0.7; text-shadow: 0 0 8px rgba(255, 234, 0, 0.6); }
            100% { opacity: 1; text-shadow: 0 0 20px rgba(255, 234, 0, 0.9), 0 0 35px rgba(255, 180, 0, 0.6); }
        }

        #spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            z-index: 10;
        }

        .title-main {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #ffea00;
            text-shadow: 0 0 12px rgba(255, 234, 0, 0.8), 0 0 25px rgba(255, 200, 0, 0.5);
            margin-bottom: 2px;
        }

        .title-sub {
            font-family: 'Great Vibes', cursive;
            font-size: 1.7rem;
            color: #b3e5fc;
            text-shadow: 0 0 8px rgba(179, 229, 252, 0.6);
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 72vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
        }

        .bouquet-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .flower-group {
            transform-origin: 200px 480px;
            opacity: 0;
        }

        /* Tiempos escalonados para que suban uno por uno */
        .start-animations .f1 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 0.2s; }
        .start-animations .f2 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 1.1s; }
        .start-animations .f3 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 2.0s; }
        .start-animations .f4 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 2.9s; }
        .start-animations .f5 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 3.8s; }
        .start-animations .f6 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 4.7s; }

        @keyframes growUp {
            0% { transform: scale(0) translateY(180px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .start-animations .sway-flower-1 { transform-origin: 200px 480px; animation: windSway1 4.5s ease-in-out infinite alternate; }
        .start-animations .sway-flower-2 { transform-origin: 200px 480px; animation: windSway2 5.2s ease-in-out infinite alternate; }
        .start-animations .sway-flower-3 { transform-origin: 200px 480px; animation: windSway3 4.8s ease-in-out infinite alternate; }

        @keyframes windSway1 {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
            100% { transform: rotate(-1.8deg); }
        }

        @keyframes windSway2 {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-2.5deg); }
            100% { transform: rotate(1.5deg); }
        }

        @keyframes windSway3 {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(1.8deg); }
            100% { transform: rotate(-2.2deg); }
        }

        .pink-ribbon-group { opacity: 0; }
        .start-animations .pink-ribbon-group {
            animation: fadeInRibbon 0.4s ease forwards;
            animation-delay: 5.8s;
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.65));
        }

        @keyframes fadeInRibbon { to { opacity: 1; } }

        .start-animations .ribbon-wrap-animated {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: drawRibbon 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 5.9s;
        }

        @keyframes drawRibbon { to { stroke-dashoffset: 0; } }

        .start-animations .ribbon-bow-animated {
            transform-origin: 200px 405px;
            transform: scale(0);
            animation: popBow 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 6.6s;
        }

        @keyframes popBow {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .stem-path, .leaf-element { filter: drop-shadow(0 0 3px rgba(116, 198, 157, 0.35)); }
        .yellow-petals { filter: drop-shadow(0 0 4px rgba(255, 234, 0, 0.4)); }
        .brown-center { filter: drop-shadow(0 0 3px rgba(210, 105, 30, 0.2)); }

        .start-animations .sway-grass-1 { transform-origin: bottom center; animation: grassWind1 3.5s ease-in-out infinite alternate; }
        .start-animations .sway-grass-2 { transform-origin: bottom center; animation: grassWind2 4.1s ease-in-out infinite alternate; }
        .start-animations .sway-grass-3 { transform-origin: bottom center; animation: grassWind3 3.2s ease-in-out infinite alternate; }

        @keyframes grassWind1 { 0% { transform: rotate(0deg); } 100% { transform: rotate(5deg); } }
        @keyframes grassWind2 { 0% { transform: rotate(0deg); } 100% { transform: rotate(-6deg); } }
        @keyframes grassWind3 { 0% { transform: rotate(0deg); } 100% { transform: rotate(4deg); } }

        .grass-layer { filter: drop-shadow(0 -6px 12px rgba(116, 198, 157, 0.6)); }

        .butterfly {
            position: absolute;
            width: 26px;
            height: 26px;
            z-index: 15;
            pointer-events: none;
            filter: drop-shadow(0 0 4px rgba(255, 105, 180, 0.45));
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .start-animations .butterfly { opacity: 1; }

        .butterfly-1 { top: 40%; left: 15%; animation: floatButterfly1 4.5s ease-in-out infinite alternate; }
        .butterfly-2 { top: 50%; right: 18%; animation: floatButterfly2 3.8s ease-in-out infinite alternate 0.5s; }
        .butterfly-3 { top: 30%; right: 35%; animation: floatButterfly3 5.2s ease-in-out infinite alternate 1s; }
        .butterfly-4 { top: 22%; left: 22%; animation: floatButterfly4 4.0s ease-in-out infinite alternate 1.5s; }
        .butterfly-5 { top: 60%; left: 38%; animation: floatButterfly5 4.8s ease-in-out infinite alternate 0.8s; }

        @keyframes floatButterfly1 {
            0% { transform: translate(0, 0) rotate(-5deg); opacity: 0.9; }
            50% { transform: translate(25px, -30px) rotate(12deg); opacity: 1; }
            100% { transform: translate(-15px, -50px) rotate(-10deg); opacity: 0.95; }
        }
        @keyframes floatButterfly2 {
            0% { transform: translate(0, 0) rotate(10deg); opacity: 0.85; }
            50% { transform: translate(-30px, -20px) rotate(-15deg); opacity: 1; }
            100% { transform: translate(15px, -45px) rotate(8deg); opacity: 0.9; }
        }
        @keyframes floatButterfly3 {
            0% { transform: translate(0, 0) rotate(-8deg); opacity: 0.9; }
            50% { transform: translate(-20px, -40px) rotate(6deg); opacity: 1; }
            100% { transform: translate(-35px, -15px) rotate(-12deg); opacity: 0.85; }
        }
        @keyframes floatButterfly4 {
            0% { transform: translate(0, 0) rotate(15deg); opacity: 0.88; }
            50% { transform: translate(30px, -15px) rotate(-8deg); opacity: 1; }
            100% { transform: translate(10px, -55px) rotate(10deg); opacity: 0.92; }
        }
        @keyframes floatButterfly5 {
            0% { transform: translate(0, 0) rotate(-12deg); opacity: 0.85; }
            50% { transform: translate(-15px, -35px) rotate(14deg); opacity: 1; }
            100% { transform: translate(25px, -25px) rotate(-6deg); opacity: 0.9; }
        }

        .wing-left { transform-origin: 12px 12px; animation: flutterLeft 0.32s ease-in-out infinite alternate; }
        .wing-right { transform-origin: 12px 12px; animation: flutterRight 0.32s ease-in-out infinite alternate; }

        @keyframes flutterLeft { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.25); } }
        @keyframes flutterRight { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.25); } }

        .gift-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 48px;
            height: 48px;
            background: #111;
            border: 2px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
            z-index: 100;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .card {
            background: #ffffff;
            color: #333333;
            width: 88%;
            max-width: 320px;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 15px;
            background: none; border: none;
            font-size: 20px; color: #999; cursor: pointer;
        }

        .cats-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .heart-icon { font-size: 28px; color: #ff4d6d; }
        .card-title { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: #d4a373; margin-bottom: 10px; }
        .card-text { font-size: 0.95rem; line-height: 1.5; color: #555; min-height: 65px; }
        .card-dots { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .dot { width: 8px; height: 8px; background-color: #ccc; border-radius: 50%; cursor: pointer; }
        .dot.active { background-color: #d4a373; width: 18px; border-radius: 4px; }

        .music-btn {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initUniverse();
        });

        const stars = [];
        const cosmicDust = [];
        const STAR_COUNT = 90;
        const DUST_COUNT = 15;
        let universeActive = false;

        const colors = [
            'rgba(255, 234, 0, ',
            'rgba(255, 182, 193, ',
            'rgba(186, 85, 211, ',
            'rgba(135, 206, 250, ',
            'rgba(255, 255, 255, '
        ];

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 1.3 + 0.4;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random();
                this.twinkleSpeed = Math.random() * 0.015 + 0.004;
                this.direction = Math.random() > 0.5 ? 1 : -1;
            }
            update() {
                this.alpha += this.twinkleSpeed * this.direction;
                if (this.alpha >= 0.95 || this.alpha <= 0.15) { this.direction *= -1; }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.alpha + ')';
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class CosmicParticle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + Math.random() * 20;
                this.radius = Math.random() * 1.8 + 0.6;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * 0.18 + 0.08;
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.alpha = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10 || this.x < -10 || this.x > width + 10) { this.reset(false); }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color + Math.max(0, Math.min(0.6, this.alpha)) + ')';
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color + '0.5)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initUniverse() {
            stars.length = 0;
            cosmicDust.length = 0;
            for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());
            for (let i = 0; i < DUST_COUNT; i++) cosmicDust.push(new CosmicParticle());
        }

        function animateUniverse() {
            if (!universeActive) return;
            ctx.clearRect(0, 0, width, height);

            const nebulaGrad = ctx.createRadialGradient(width / 2, height / 2, width * 0.1, width / 2, height / 2, width * 0.7);
            nebulaGrad.addColorStop(0, 'rgba(25, 12, 40, 0.25)');
            nebulaGrad.addColorStop(0.6, 'rgba(8, 4, 20, 0.15)');
            nebulaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebulaGrad;
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => { star.update(); star.draw(); });
            cosmicDust.forEach(dust => { dust.update(); dust.draw(); });

            requestAnimationFrame(animateUniverse);
        }

        initUniverse();

        const welcomeScreen = document.getElementById('welcomeScreen');
        const mainBody = document.getElementById('mainBody');

        welcomeScreen.addEventListener('click', () => {
            welcomeScreen.classList.add('fade-out');
            mainBody.classList.add('start-animations');
            universeActive = true;
            animateUniverse();
        });

        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const cardTitle = document.getElementById('cardTitle');
        const cardText = document.getElementById('cardText');
        const dots = document.querySelectorAll('.dot');

        const slides = [
            { title: "Para ti", text: "Las flores amarillas representan la luz, la alegría y la energía que traes a mi vida cada día." },
            { title: "Con mucho cariño", text: "Espero que este detalle ilumine tu día y te recuerde lo especial que eres para mí." }
        ];

        let currentSlide = 0;

        function updateSlide(index) {
            currentSlide = index;
            cardTitle.innerText = slides[index].title;
            cardText.innerText = slides[index].text;
            dots.forEach((dot, i) => { dot.classList.toggle('active', i === index); });
        }

        openModalBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
        closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

        dots.forEach((dot, index) => { dot.addEventListener('click', () => updateSlide(index)); });

        document.querySelector('.card').addEventListener('click', (e) => {
            if (e.target !== closeModalBtn && !e.target.classList.contains('dot')) {
                updateSlide((currentSlide + 1) % slides.length);
            }
        });

        const musicBtn = document.getElementById('musicBtn');
        let audioCtx = null;
        let isPlaying = false;
        let interstellarInterval = null;

        const NOTE_FREQ = {
            'A3': 220.00, 'B3': 246.94, 'C4': 261.63, 'D4': 293.66, 'E4': 329.63,
            'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25,
            'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00
        };

        const interstellarSequence = [
            { main: 'E5', bass: 'A3', dur: 0.65 }, { main: 'A4', bass: null, dur: 0.65 },
            { main: 'E5', bass: null, dur: 0.65 }, { main: 'A4', bass: null, dur: 0.65 },
            { main: 'C5', bass: 'F4', dur: 0.65 }, { main: 'F4', bass: null, dur: 0.65 },
            { main: 'C5', bass: null, dur: 0.65 }, { main: 'F4', bass: null, dur: 0.65 },
            { main: 'E5', bass: 'C4', dur: 0.65 }, { main: 'G4', bass: null, dur: 0.65 },
            { main: 'E5', bass: null, dur: 0.65 }, { main: 'G4', bass: null, dur: 0.65 },
            { main: 'D5', bass: 'G3', dur: 0.65 }, { main: 'G4', bass: null, dur: 0.65 },
            { main: 'D5', bass: null, dur: 0.65 }, { main: 'B4', bass: null, dur: 0.65 }
        ];

        function playOrganTone(freq, duration, volume = 0.08, isBass = false) {
            if (!freq || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc1.type = isBass ? 'triangle' : 'sawtooth';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * (isBass ? 0.5 : 2.0), now);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(isBass ? 400 : 1800, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + 1.2);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + duration + 1.3);
            osc2.stop(now + duration + 1.3);
        }

        function playInterstellarTheme() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let seqIndex = 0;
            interstellarInterval = setInterval(() => {
                if (!isPlaying) return;
                const noteData = interstellarSequence[seqIndex];
                const mainFreq = NOTE_FREQ[noteData.main];
                const bassFreq = noteData.bass ? (NOTE_FREQ[noteData.bass] || NOTE_FREQ['G4'] * 0.5) : null;

                playOrganTone(mainFreq, noteData.dur, 0.07, false);
                if (bassFreq) playOrganTone(bassFreq, noteData.dur * 3.5, 0.12, true);

                seqIndex = (seqIndex + 1) % interstellarSequence.length;
            }, 380);
        }

        musicBtn.addEventListener('click', () => {
            if (!isPlaying) {
            } else {
                isPlaying = false;

                if (interstellarInterval) clearInterval(interstellarInterval);
            }
        });
    </script>
</body>
</html>
