<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* --- PANTALLA DE INICIO CON GIRASOL MÁS GRANDE Y ANIMACIÓN DE GIRO 360° --- */
        #welcomeScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1200 0%, #080500 50%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease 0.6s, visibility 0.8s ease 0.6s;
        }

        #welcomeScreen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Aura luminosa ajustada para el nuevo tamaño del girasol */
        .welcome-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.35) 0%, rgba(255, 140, 0, 0.15) 50%, transparent 70%);
            border-radius: 50%;
            animation: auraPulse 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes auraPulse {
            0% { transform: scale(0.85); opacity: 0.5; }
            100% { transform: scale(1.25); opacity: 0.9; }
        }

        .welcome-sunflower-container {
            position: relative;
            width: 380px; /* Tamaño aumentado significativamente */
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .welcome-sunflower {
            width: 350px; /* Girasol gigante e imponente */
            height: 350px;
            animation: floatFlower 3.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.75));
            z-index: 2;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), filter 1.2s ease;
        }

        /* Transición de giro 360° al interactuar */
        #welcomeScreen.spin-out .welcome-sunflower {
            transform: scale(1.25) rotate(360deg);
            filter: drop-shadow(0 0 60px rgba(255, 215, 0, 1));
        }

        #welcomeScreen.spin-out .welcome-card {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        @keyframes floatFlower {
            0% { transform: translateY(0px) rotate(-2deg) scale(0.98); }
            100% { transform: translateY(-12px) rotate(2deg) scale(1.03); }
        }

        .welcome-particle {
            position: absolute;
            background: #ffea00;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px #ffea00;
            animation: floatParticle 3.5s ease-in-out infinite alternate;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0px) scale(0.7); opacity: 0.3; }
            100% { transform: translateY(-35px) scale(1.3); opacity: 1; }
        }

        .welcome-card {
            z-index: 2;
            padding: 14px 32px;
            background: rgba(255, 234, 0, 0.08);
            border: 1px solid rgba(255, 234, 0, 0.35);
            border-radius: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), inset 0 0 12px rgba(255, 234, 0, 0.15);
            animation: cardGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 234, 0, 0.1); border-color: rgba(255, 234, 0, 0.25); }
            100% { box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 234, 0, 0.35); border-color: rgba(255, 234, 0, 0.7); }
        }

        .welcome-text {
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 2.2rem;
            color: #ffea00;
            text-shadow: 0 0 12px rgba(255, 234, 0, 0.8);
            letter-spacing: 1px;
            text-align: center;
        }

        /* --- ESCENA PRINCIPAL Y COMPONENTES --- */
        #spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-top: 35px;
            padding: 6px 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(3px);
        }

        .title-main {
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 2.6rem;
            color: #ffea00;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 234, 0, 0.6);
            margin-bottom: 2px;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 72vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
        }

        .bouquet-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .flower-group {
            transform-origin: 200px 480px;
            opacity: 0;
        }

        .start-animations .f1 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 0.2s; }
        .start-animations .f2 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 1.1s; }
        .start-animations .f3 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 2.0s; }
        .start-animations .f4 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 2.9s; }
        .start-animations .f5 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 3.8s; }
        .start-animations .f6 { animation: growUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 4.7s; }

        @keyframes growUp {
            0% { transform: scale(0) translateY(180px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .start-animations .sway-flower-1 { transform-origin: 200px 480px; animation: windSway1 4.5s ease-in-out infinite alternate; }
        .start-animations .sway-flower-2 { transform-origin: 200px 480px; animation: windSway2 5.2s ease-in-out infinite alternate; }
        .start-animations .sway-flower-3 { transform-origin: 200px 480px; animation: windSway3 4.8s ease-in-out infinite alternate; }

        @keyframes windSway1 { 0% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } 100% { transform: rotate(-1.8deg); } }
        @keyframes windSway2 { 0% { transform: rotate(0deg); } 50% { transform: rotate(-2.5deg); } 100% { transform: rotate(1.5deg); } }
        @keyframes windSway3 { 0% { transform: rotate(0deg); } 50% { transform: rotate(1.8deg); } 100% { transform: rotate(-2.2deg); } }

        .pink-ribbon-group { opacity: 0; }
        .start-animations .pink-ribbon-group {
            animation: fadeInRibbon 0.4s ease forwards;
            animation-delay: 5.8s;
        }

        @keyframes fadeInRibbon { to { opacity: 1; } }

        .start-animations .ribbon-wrap-animated {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: drawRibbon 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 5.9s;
        }

        @keyframes drawRibbon { to { stroke-dashoffset: 0; } }

        .start-animations .ribbon-bow-animated {
            transform-origin: 200px 405px;
            transform: scale(0);
            animation: popBow 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 6.6s;
        }

        @keyframes popBow {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .start-animations .sway-grass-1 { transform-origin: bottom center; animation: grassWind1 3.5s ease-in-out infinite alternate; }
        .start-animations .sway-grass-2 { transform-origin: bottom center; animation: grassWind2 4.1s ease-in-out infinite alternate; }
        .start-animations .sway-grass-3 { transform-origin: bottom center; animation: grassWind3 3.2s ease-in-out infinite alternate; }

        @keyframes grassWind1 { 0% { transform: rotate(0deg); } 100% { transform: rotate(5deg); } }
        @keyframes grassWind2 { 0% { transform: rotate(0deg); } 100% { transform: rotate(-6deg); } }
        @keyframes grassWind3 { 0% { transform: rotate(0deg); } 100% { transform: rotate(4deg); } }

        .g-stem { opacity: 0; transform-origin: bottom center; }
        .start-animations .g-stem { animation: sproutDesorden 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .start-animations .g1 { animation-delay: 0.1s; } .start-animations .g2 { animation-delay: 1.2s; }
        .start-animations .g3 { animation-delay: 0.5s; } .start-animations .g4 { animation-delay: 2.1s; }
        .start-animations .g5 { animation-delay: 0.3s; } .start-animations .g6 { animation-delay: 1.8s; }
        .start-animations .g7 { animation-delay: 0.9s; } .start-animations .g8 { animation-delay: 2.5s; }
        .start-animations .g9 { animation-delay: 0.4s; } .start-animations .g10 { animation-delay: 1.5s; }
        .start-animations .g11 { animation-delay: 0.2s; } .start-animations .g12 { animation-delay: 2.8s; }
        .start-animations .g13 { animation-delay: 1.1s; } .start-animations .g14 { animation-delay: 0.7s; }
        .start-animations .g15 { animation-delay: 2.3s; } .start-animations .g16 { animation-delay: 1.6s; }
        .start-animations .g17 { animation-delay: 0.8s; } .start-animations .g18 { animation-delay: 2.0s; }
        .start-animations .g19 { animation-delay: 1.3s; } .start-animations .g20 { animation-delay: 2.7s; }
        .start-animations .g21 { animation-delay: 3.2s; }

        @keyframes sproutDesorden {
            0% { opacity: 0; transform: translateY(80px) scaleY(0); }
            40% { opacity: 1; }
            100% { opacity: 1; transform: translateY(0) scaleY(1); }
        }

        .butterfly {
            position: absolute;
            width: 26px;
            height: 26px;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .start-animations .butterfly { opacity: 1; }

        .butterfly-1 { top: 40%; left: 15%; animation: floatButterfly1 4.5s ease-in-out infinite alternate; }
        .butterfly-2 { top: 50%; right: 18%; animation: floatButterfly2 3.8s ease-in-out infinite alternate 0.5s; }
        .butterfly-3 { top: 30%; right: 35%; animation: floatButterfly3 5.2s ease-in-out infinite alternate 1s; }

        @keyframes floatButterfly1 { 0% { transform: translate(0, 0) rotate(-5deg); opacity: 0.9; } 50% { transform: translate(25px, -30px) rotate(12deg); opacity: 1; } 100% { transform: translate(-15px, -50px) rotate(-10deg); opacity: 0.95; } }
        @keyframes floatButterfly2 { 0% { transform: translate(0, 0) rotate(10deg); opacity: 0.85; } 50% { transform: translate(-30px, -20px) rotate(-15deg); opacity: 1; } 100% { transform: translate(15px, -45px) rotate(8deg); opacity: 0.9; } }
        @keyframes floatButterfly3 { 0% { transform: translate(0, 0) rotate(-8deg); opacity: 0.9; } 50% { transform: translate(-20px, -40px) rotate(6deg); opacity: 1; } 100% { transform: translate(-35px, -15px) rotate(-12deg); opacity: 0.85; } }

        .wing-left { transform-origin: 12px 12px; animation: flutterLeft 0.32s ease-in-out infinite alternate; }
        .wing-right { transform-origin: 12px 12px; animation: flutterRight 0.32s ease-in-out infinite alternate; }

        @keyframes flutterLeft { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.25); } }
        @keyframes flutterRight { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.25); } }

        .gift-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 48px;
            height: 48px;
            background: #111;
            border: 2px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .card {
            background: #ffffff;
            color: #333333;
            width: 88%;
            max-width: 320px;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 15px;
            background: none; border: none;
            font-size: 20px; color: #999; cursor: pointer;
        }

        .cats-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .heart-icon { font-size: 28px; color: #ff4d6d; }
        .card-title { font-family: 'Dancing Script', cursive; font-weight: 700; font-size: 2.2rem; color: #d4a373; margin-bottom: 10px; }
        .card-text { font-size: 0.95rem; line-height: 1.5; color: #555; min-height: 65px; }
        .card-dots { display: flex; justify-content: center; gap: 8px; margin-top: 15px; }
        .dot { width: 8px; height: 8px; background-color: #ccc; border-radius: 50%; cursor: pointer; }
        .dot.active { background-color: #d4a373; width: 18px; border-radius: 4px; }

        .music-btn {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body id="mainBody">

    <button class="music-btn" id="musicBtn">⏸️ Pausa</button>

    <div id="welcomeScreen">
        <div class="welcome-glow"></div>
        <div class="welcome-sunflower-container">
            <div class="welcome-particle" style="width: 8px; height: 8px; bottom: 10px; left: 20px; animation-duration: 2.5s; animation-delay: 0.2s;"></div>
            <div class="welcome-particle" style="width: 6px; height: 6px; bottom: 30px; left: 0px; animation-duration: 3.8s; animation-delay: 0.8s;"></div>
            <div class="welcome-particle" style="width: 9px; height: 9px; bottom: 5px; right: 30px; animation-duration: 2.9s; animation-delay: 0.4s;"></div>
            <div class="welcome-particle" style="width: 7px; height: 7px; bottom: 40px; right: 10px; animation-duration: 4.1s; animation-delay: 1.2s;"></div>

            <svg class="welcome-sunflower" viewBox="-70 -70 140 140">
                <defs>
                    <linearGradient id="welcomePetalGradBack" x1="0%" y1="100%" x2="0%" y2="0%">

        </div>
        <div class="welcome-card">
            <div class="welcome-text">Toca para abrir ✨</div>

    </div>

    <canvas id="spaceCanvas"></canvas>

    <div class="header">
        <h1 class="title-main">Feliz día de las flores amarillas</h1>
    </div>

    <div class="stage">
        <svg class="bouquet-svg" viewBox="0 0 400 500">
            <defs>
                <linearGradient id="petalGradBack" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#121212"/>
                    <stop offset="32%" stop-color="#ff9900"/>
                    <stop offset="85%" stop-color="#ffea00"/>
                </linearGradient>
                <linearGradient id="petalGradFront" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#1a1a1a"/>
                    <stop offset="35%" stop-color="#ffaa00"/>
                    <stop offset="90%" stop-color="#ffff33"/>
                </linearGradient>
                <linearGradient id="pinkRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffc0cb"/>
                    <stop offset="35%" stop-color="#ff69b4"/>
                    <stop offset="100%" stop-color="#d81b60"/>
                </linearGradient>
                <linearGradient id="pinkRibbonDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ff1493"/>
                    <stop offset="100%" stop-color="#880e4f"/>
                </linearGradient>
                <linearGradient id="grassGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#000000"/>
                    <stop offset="48%" stop-color="#2d7a4d"/>
                    <stop offset="100%" stop-color="#b7e4c7"/>
                </linearGradient>
                <linearGradient id="grassGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#000000"/>
                    <stop offset="50%" stop-color="#1b5e37"/>
                    <stop offset="100%" stop-color="#95d5b2"/>
                </linearGradient>
                <radialGradient id="centerGrad3D" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#4a2810"/>
                    <stop offset="50%" stop-color="#2a1405"/>
                    <stop offset="100%" stop-color="#050200"/>
                </radialGradient>
                <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#1b5e37"/>
                    <stop offset="100%" stop-color="#52b788"/>
                </linearGradient>
                <linearGradient id="pinkWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#ff1493"/>
                </linearGradient>
                <g id="leaf3D">
                    <path d="M 0 0 C -25 -15, -35 -50, 0 -65 C 35 -50, 25 -15, 0 0 Z" fill="url(#leafGrad)" stroke="#114b29" stroke-width="1.2"/>
                    <path d="M 0 0 L 0 -60" stroke="#74c69d" stroke-width="1.5" opacity="0.8"/>
                </g>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth < 768);

        let width = 0;
        let height = 0;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        resizeCanvas();

        window.addEventListener('resize', () => {
            resizeCanvas();
            initUniverse();
        });

        const stars = [];
        const cosmicDust = [];
        const STAR_COUNT = isMobile ? 40 : 80;
        const DUST_COUNT = isMobile ? 8 : 15;
        let universeActive = false;

        const colors = [
            'rgba(255, 234, 0, ',
            'rgba(255, 182, 193, ',
            'rgba(186, 85, 211, ',
            'rgba(135, 206, 250, ',
            'rgba(255, 255, 255, '
        ];

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 1.3 + 0.4;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random();
                this.twinkleSpeed = Math.random() * 0.015 + 0.004;
                this.direction = Math.random() > 0.5 ? 1 : -1;
            }
            update() {
                this.alpha += this.twinkleSpeed * this.direction;
                if (this.alpha >= 0.95 || this.alpha <= 0.15) { this.direction *= -1; }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.alpha + ')';
                ctx.fill();
            }
        }

        class CosmicParticle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + Math.random() * 20;
                this.radius = Math.random() * 1.8 + 0.6;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * 0.18 + 0.08;
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.alpha = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10 || this.x < -10 || this.x > width + 10) { this.reset(false); }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color + Math.max(0, Math.min(0.6, this.alpha)) + ')';
                ctx.fill();
            }
        }

        class AssemblingEyeSystem {
            constructor() {
                this.particles = [];
                this.blinkProgress = 0;
                this.isBlinking = false;
                this.blinkTimer = 0;
                this.nextBlink = Math.random() * 80 + 50; 
                
                this.isAssembling = false;
                this.assemblyProgress = 0;
                this.isFullyFormed = false;

                this.createEyeParticles();
            }

            startAssembly() {
                this.isAssembling = true;
            }

            createEyeParticles() {
                this.particles = [];
                const centerX = width / 2;
                const centerY = height * 0.38;
                const eyeSpacing = Math.min(width * 0.28, 110);
                const eyeWidth = Math.min(width * 0.22, 85);
                const eyeHeight = eyeWidth * 0.42;

                [ -eyeSpacing, eyeSpacing ].forEach((sideX, eyeIndex) => {
                    const isRight = eyeIndex === 1;

                    // 1. Pestañas Femeninas
                    const upperLashCount = isMobile ? 80 : 130;
                    for (let i = 0; i < upperLashCount; i++) {
                        const t = i / upperLashCount;
                        const rx = -eyeWidth * 1.08 + t * (eyeWidth * 2.16);
                        const ry = -Math.sin(t * Math.PI) * (eyeHeight * 1.5);

                        const outerWeight = isRight ? t : (1 - t);
                        const lashLength = Math.pow(outerWeight, 1.2) * 24 + 6;
                        const lashAngle = (t - 0.5) * (isRight ? 1.25 : -1.25) - 1.25;

                        const isLashTip = Math.random() > 0.35;
                        const finalRx = rx + (isLashTip ? Math.cos(lashAngle) * lashLength : 0);
                        const finalRy = ry + (isLashTip ? Math.sin(lashAngle) * lashLength : 0);

                        this.addParticle({
                            targetX: centerX + sideX + finalRx,
                            targetY: centerY + finalRy,
                            relX: finalRx,
                            relY: finalRy,
                            eyeX: sideX,
                            isPupil: false,
                            radius: isLashTip ? (Math.random() * 0.9 + 0.4) : (Math.random() * 1.5 + 0.7),
                            color: 'rgba(255, 255, 255, ',
                            targetAlpha: Math.random() * 0.8 + 0.2,
                            type: 'lash'
                        });
                    }

                    // 2. Línea Inferior Almendrada
                    const lowerLashCount = isMobile ? 25 : 45;
                    for (let i = 0; i < lowerLashCount; i++) {
                        const t = i / lowerLashCount;
                        const rx = -eyeWidth * 0.95 + t * (eyeWidth * 1.9);
                        const ry = Math.sin(t * Math.PI) * (eyeHeight * 0.6);

                        this.addParticle({
                            targetX: centerX + sideX + rx,
                            targetY: centerY + ry,
                            relX: rx,
                            relY: ry,
                            eyeX: sideX,
                            isPupil: false,
                            radius: Math.random() * 1.1 + 0.4,
                            color: 'rgba(255, 255, 255, ',
                            targetAlpha: Math.random() * 0.6 + 0.2,
                            type: 'lower'
                        });
                    }

                    // 3. PUPILAS VERDES RESPLANDECIENTES
                    const pupilParticleCount = isMobile ? 65 : 110;
                    const pupilRadius = eyeHeight * 0.8;

                    for (let i = 0; i < pupilParticleCount; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const r = Math.sqrt(Math.random()) * pupilRadius;
                        const rx = Math.cos(angle) * r;
                        const ry = Math.sin(angle) * r;

                        const isCenterBright = r < pupilRadius * 0.35;

                        this.addParticle({
                            targetX: centerX + sideX + rx,
                            targetY: centerY + ry,
                            relX: rx,
                            relY: ry,
                            eyeX: sideX,
                            isPupil: true,
                            radius: isCenterBright ? (Math.random() * 1.5 + 0.8) : (Math.random() * 1.1 + 0.4),
                            color: isCenterBright ? 'rgba(0, 255, 180, ' : 'rgba(16, 185, 129, ',
                            targetAlpha: Math.random() * 0.7 + 0.3,
                            type: 'pupil'
                        });
                    }

                    // 4. ESTRELLA BRILLANTE EN EL CENTRO DE LA PUPILA
                    const starArmPoints = 20;
                    const starSize = pupilRadius * 0.85;

                    for (let i = 0; i < starArmPoints; i++) {
                        const isHorizontal = i % 2 === 0;
                        const dist = (Math.random() * 0.8 + 0.2) * starSize;
                        const rx = isHorizontal ? (Math.random() > 0.5 ? dist : -dist) : 0;
                        const ry = !isHorizontal ? (Math.random() > 0.5 ? dist : -dist) : 0;

                        this.addParticle({
                            targetX: centerX + sideX + rx,
                            targetY: centerY + ry,
                            relX: rx,
                            relY: ry,
                            eyeX: sideX,
                            isPupil: true,
                            isStarCore: true,
                            radius: Math.random() * 1.2 + 0.8,
                            color: 'rgba(255, 255, 255, ',
                            targetAlpha: 1.0,
                            type: 'star'
                        });
                    }

                    // 5. Ceja Femenina
                    const browCount = isMobile ? 30 : 50;
                    const eyebrowY = -eyeHeight * 1.8;
                    for (let i = 0; i < browCount; i++) {
                        const t = i / browCount;
                        const rx = -eyeWidth * 1.05 + t * (eyeWidth * 2.1);
                        const arch = Math.sin(t * Math.PI) * 15;
                        const tailDrop = (isRight ? (t - 0.5) : (0.5 - t)) * 5;
                        const ry = eyebrowY - arch + tailDrop;

                        this.addParticle({
                            targetX: centerX + sideX + rx,
                            targetY: centerY + ry,
                            relX: rx,
                            relY: ry,
                            eyeX: sideX,
                            isPupil: false,
                            radius: Math.random() * 0.9 + 0.4,
                            color: 'rgba(255, 255, 255, ',
                            targetAlpha: Math.random() * 0.5 + 0.15,
                            type: 'brow'
                        });
                    }
                });
            }

            addParticle(config) {
                const startX = Math.random() * width;
                const startY = Math.random() * height;

                this.particles.push({
                    x: startX,
                    y: startY,
                    startX: startX,
                    startY: startY,
                    targetX: config.targetX,
                    targetY: config.targetY,
                    relX: config.relX,
                    relY: config.relY,
                    baseRelY: config.relY,
                    eyeX: config.eyeX,
                    isPupil: config.isPupil,
                    isStarCore: config.isStarCore || false,
                    radius: config.radius,
                    color: config.color,
                    targetAlpha: config.targetAlpha,
                    currentAlpha: Math.random() * 0.3 + 0.1,
                    twinkleSpeed: Math.random() * 0.03 + 0.015,
                    type: config.type,
                    delay: Math.random() * 30,
                    travelProgress: 0,
                    speed: Math.random() * 0.04 + 0.025
                });
            }

            update() {
                const centerX = width / 2;
                const centerY = height * 0.38;

                if (this.isAssembling) {
                    this.assemblyProgress++;
                }

                if (this.isAssembling && !this.isFullyFormed) {
                    const allArrived = this.particles.every(p => p.travelProgress >= 1);
                    if (allArrived) {
                        this.isFullyFormed = true;
                        this.isBlinking = true;
                        this.blinkProgress = 0;
                    }
                }

                if (this.isFullyFormed) {
                    if (!this.isBlinking) {
                        this.blinkTimer++;
                        if (this.blinkTimer >= this.nextBlink) {
                            this.isBlinking = true;
                            this.blinkTimer = 0;
                        }
                    }

                    if (this.isBlinking) {
                        this.blinkProgress += 0.09; 
                        if (this.blinkProgress >= Math.PI) {
                            this.blinkProgress = 0;
                            this.isBlinking = false;
                            this.nextBlink = Math.random() * 100 + 70; 
                        }
                    }
                }

                const rawBlink = Math.sin(this.blinkProgress);
                const smoothBlink = rawBlink * rawBlink * (3 - 2 * rawBlink);
                const blinkFactor = 1 - smoothBlink;

                this.particles.forEach(p => {
                    if (this.isAssembling && this.assemblyProgress > p.delay) {
                        if (p.travelProgress < 1) {
                            p.travelProgress += p.speed;
                            if (p.travelProgress > 1) p.travelProgress = 1;

                            const ease = 1 - Math.pow(1 - p.travelProgress, 3);
                            
                            p.targetX = centerX + p.eyeX + p.relX;
                            p.targetY = centerY + p.relY;

                            const shakeIntensity = (1 - p.travelProgress) * 3.5;
                            const shakeX = (Math.random() - 0.5) * shakeIntensity;
                            const shakeY = (Math.random() - 0.5) * shakeIntensity;

                            p.x = p.startX + (p.targetX - p.startX) * ease + shakeX;
                            p.y = p.startY + (p.targetY - p.startY) * ease + shakeY;

                            p.currentAlpha = p.targetAlpha * ease;
                        } else {
                            if (p.type !== 'brow') {
                                p.relY = p.baseRelY * blinkFactor;
                            }
                            p.x = centerX + p.eyeX + p.relX;
                            p.y = centerY + p.relY;

                            p.targetAlpha += p.twinkleSpeed;
                            if (p.targetAlpha >= 0.95 || p.targetAlpha <= 0.2) p.twinkleSpeed *= -1;
                            p.currentAlpha = p.targetAlpha;
                        }
                    } else {
                        p.currentAlpha += p.twinkleSpeed * 0.3;
                        if (p.currentAlpha >= 0.5 || p.currentAlpha <= 0.05) p.twinkleSpeed *= -1;
                    }
                });
            }

            draw() {
                const centerX = width / 2;
                const centerY = height * 0.38;

                if (this.assemblyProgress > 20) {
                    const glowOpacity = Math.min(1, (this.assemblyProgress - 20) / 40);
                    const eyeSpacing = Math.min(width * 0.28, 110);
                    [centerX - eyeSpacing, centerX + eyeSpacing].forEach(eX => {
                        const glowGrad = ctx.createRadialGradient(eX, centerY, 2, eX, centerY, 75);
                        glowGrad.addColorStop(0, `rgba(0, 255, 180, ${0.4 * glowOpacity})`);
                        glowGrad.addColorStop(0.4, `rgba(16, 185, 129, ${0.18 * glowOpacity})`);
                        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.arc(eX, centerY, 75, 0, Math.PI * 2);
                        ctx.fill();

                        if (this.assemblyProgress > 40) {
                            const rawBlink = Math.sin(this.blinkProgress);
                            const smoothBlink = rawBlink * rawBlink * (3 - 2 * rawBlink);
                            const starAlpha = Math.min(1, (this.assemblyProgress - 40) / 30) * (1 - smoothBlink);
                            const starRadius = 14;

                            ctx.save();
                            ctx.translate(eX, centerY);

                            ctx.beginPath();
                            ctx.moveTo(-starRadius, 0);
                            ctx.quadraticCurveTo(0, 0, starRadius, 0);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${starAlpha})`;
                            ctx.lineWidth = 2.5;
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.moveTo(0, -starRadius);
                            ctx.quadraticCurveTo(0, 0, 0, starRadius);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${starAlpha})`;
                            ctx.lineWidth = 2.5;
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.arc(0, 0, 3, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255, 255, 255, ${starAlpha})`;
                            ctx.fill();

                            ctx.restore();
                        }
                    });
                }

                this.particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + Math.max(0, Math.min(1, p.currentAlpha)) + ')';
                    ctx.fill();
                });
            }
        }

        let eyeBackground = new AssemblingEyeSystem();

        function initUniverse() {
            stars.length = 0;
            cosmicDust.length = 0;
            for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());
            for (let i = 0; i < DUST_COUNT; i++) cosmicDust.push(new CosmicParticle());
            eyeBackground = new AssemblingEyeSystem();
        }

        let lastFrameTime = 0;
        const fpsInterval = 1000 / 60;

        function animateUniverse(timestamp) {
            if (!universeActive) return;

            requestAnimationFrame(animateUniverse);

            const elapsed = timestamp - lastFrameTime;
            if (elapsed < fpsInterval) return;
            lastFrameTime = timestamp - (elapsed % fpsInterval);

            ctx.clearRect(0, 0, width, height);

            stars.forEach(star => { star.update(); star.draw(); });
            cosmicDust.forEach(dust => { dust.update(); dust.draw(); });

            eyeBackground.update();
            eyeBackground.draw();
        }

        initUniverse();

        const welcomeScreen = document.getElementById('welcomeScreen');
        const mainBody = document.getElementById('mainBody');

        welcomeScreen.addEventListener('click', () => {
            welcomeScreen.classList.add('spin-out');
            startPianoMusic();

            setTimeout(() => {
                welcomeScreen.classList.add('fade-out');
                mainBody.classList.add('start-animations');
                universeActive = true;
                requestAnimationFrame(animateUniverse);

                setTimeout(() => {
                    eyeBackground.startAssembly();
                }, 7200);
            }, 600);
        });

        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const cardTitle = document.getElementById('cardTitle');
        const cardText = document.getElementById('cardText');
        const dots = document.querySelectorAll('.dot');

        const slides = [
            { title: "Para ti", text: "Las flores amarillas representan la luz, la alegría y la energía que traes a mi vida cada día." },
            { title: "Con mucho cariño", text: "Espero que este detalle ilumine tu día y te recuerde lo especial que eres para mí." }
        ];

        let currentSlide = 0;

        function updateSlide(index) {
            currentSlide = index;
            cardTitle.innerText = slides[index].title;
            cardText.innerText = slides[index].text;
            dots.forEach((dot, i) => { dot.classList.toggle('active', i === index); });
        }

        openModalBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
        closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); });

        dots.forEach((dot, index) => { dot.addEventListener('click', () => updateSlide(index)); });

        document.querySelector('.card').addEventListener('click', (e) => {
            if (e.target !== closeModalBtn && !e.target.classList.contains('dot')) {
                updateSlide((currentSlide + 1) % slides.length);
            }
        });

        /* --- SINTETIZADOR DE PIANO ALEGRE, ROMÁNTICO Y DE AMOR --- */
        const musicBtn = document.getElementById('musicBtn');
        let audioCtx = null;
        let isPlaying = false;
        let romanticPianoTimeout = null;

        const PIANO_NOTES = {
            'C3': 130.81, 'E3': 164.81, 'G3': 196.00, 'B3': 246.94,
            'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
            'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77, 'C6': 1046.50
        };

        /* Melodía viva, risueña y llena de sentimiento romántico */
        const joyfulLoveSong = [
            { notes: ['C4', 'E4', 'G4', 'C5'], duration: 450, style: 'arpeggio' },
            { notes: ['E5'], duration: 350, style: 'melody' },
            { notes: ['G5'], duration: 350, style: 'melody' },
            { notes: ['C6'], duration: 700, style: 'melody' },
            { notes: ['B5'], duration: 350, style: 'melody' },
            { notes: ['A5'], duration: 350, style: 'melody' },
            { notes: ['G5'], duration: 700, style: 'melody' },

            { notes: ['F3', 'A3', 'C4', 'F4'], duration: 450, style: 'arpeggio' },
            { notes: ['A5'], duration: 350, style: 'melody' },
            { notes: ['C6'], duration: 350, style: 'melody' },
            { notes: ['B5'], duration: 500, style: 'melody' },
            { notes: ['A5'], duration: 400, style: 'melody' },
            { notes: ['G5'], duration: 800, style: 'melody' },

            { notes: ['G3', 'B3', 'D4', 'G4'], duration: 450, style: 'arpeggio' },
            { notes: ['D5'], duration: 350, style: 'melody' },
            { notes: ['F5'], duration: 350, style: 'melody' },
            { notes: ['E5'], duration: 450, style: 'melody' },
            { notes: ['D5'], duration: 450, style: 'melody' },
            { notes: ['C5'], duration: 900, style: 'melody' }
        ];

        function playPianoKey(freq, duration, volume = 0.14) {
            if (!freq || !audioCtx) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            /* Onda dulce de piano eléctrico/acústico */
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + (duration / 1000) + 0.9);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + (duration / 1000) + 1.0);
        }

        let songIndex = 0;

        function playNextPianoPhrase() {
            if (!isPlaying) return;

            const phrase = joyfulLoveSong[songIndex];

            if (phrase.style === 'arpeggio') {
                phrase.notes.forEach((noteName, idx) => {
                    setTimeout(() => {
                        if (isPlaying) {
                            playPianoKey(PIANO_NOTES[noteName], phrase.duration, 0.10);
                        }
                    }, idx * 95);
                });
            } else {
                playPianoKey(PIANO_NOTES[phrase.notes[0]], phrase.duration, 0.16);
            }

            songIndex = (songIndex + 1) % joyfulLoveSong.length;
            romanticPianoTimeout = setTimeout(playNextPianoPhrase, phrase.duration);
        }

        function startPianoMusic() {
            if (isPlaying) return;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            songIndex = 0;
            isPlaying = true;
            musicBtn.innerText = "⏸️ Pausa";
            playNextPianoPhrase();
        }

        musicBtn.addEventListener('click', () => {
            if (!isPlaying) {
                startPianoMusic();
            } else {
                isPlaying = false;
                musicBtn.innerText = "🎵 Música";
                if (romanticPianoTimeout) clearTimeout(romanticPianoTimeout);
            }
        });
    </script>
</body>
</html>
